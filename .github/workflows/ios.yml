name: iOS build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: xcodebuild -version && swift --version

      - name: Core logic tests
        run: swift test --package-path MenaceCore

      - name: Build app for simulator
        run: |
          set -o pipefail
          xcodebuild -project LittleMenace.xcodeproj -scheme LittleMenace \
            -destination 'generic/platform=iOS Simulator' -configuration Debug \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 \
            | grep -E "error:|warning: .*(deprecated|never|unused)|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Debug-iphonesimulator/LittleMenace.app

      - name: App unit + UI tests
        run: |
          set -o pipefail
          xcodebuild test -project LittleMenace.xcodeproj -scheme LittleMenace \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro Max' \
            -derivedDataPath build-test -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 \
            | grep -E "Test Case .*(passed|failed)|error:|AUDIT|Executed|TEST (SUCCEEDED|FAILED)|\*\* " || true
          xcrun xcresulttool get test-results summary --path TestResults.xcresult --compact 2>/dev/null | head -c 4000 || true
          xcrun xcresulttool get test-results tests --path TestResults.xcresult 2>/dev/null \
            | python3 -c "import json,sys
          d=json.load(sys.stdin)
          def walk(n,depth=0):
              r=n.get('result','')
              if n.get('nodeType') in ('Test Case','Failure Message'):
                  print(('  '*depth)+f\"{r:8} {n.get('name')}\")
              for c in n.get('children',[]): walk(c,depth+1)
          for t in d.get('testNodes',[]): walk(t)" || true
          # Fail the job if any test failed.
          ! xcrun xcresulttool get test-results summary --path TestResults.xcresult --compact 2>/dev/null | grep -q '"result":"Failed"'

      - name: Screenshot tour
        if: always()
        run: |
          set -e
          mkdir -p shots
          APP=build/Build/Products/Debug-iphonesimulator/LittleMenace.app
          BID=app.littlemenace.LittleMenace
          udid() { xcrun simctl list devices available | grep -F "$1 (" | head -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/'; }
          boot() { xcrun simctl boot "$1" || true; xcrun simctl bootstatus "$1" -b; xcrun simctl install "$1" "$APP"; }
          shot() { # udid name [launch args...]
            local U=$1 N=$2; shift 2
            xcrun simctl launch --terminate-running-process "$U" $BID "$@" >/dev/null
            sleep 4
            xcrun simctl io "$U" screenshot "shots/$N.png" >/dev/null 2>&1
          }
          SE=$(udid "iPhone SE (3rd generation)")
          if [ -n "$SE" ]; then
            boot "$SE"
            shot "$SE" se-home
            xcrun simctl ui "$SE" content_size accessibility-extra-extra-extra-large
            shot "$SE" se-stamps-axxxl -LMScreen stamps
            xcrun simctl ui "$SE" content_size large
            xcrun simctl shutdown "$SE"
          fi
          PM=$(udid "iPhone 16 Pro Max")
          boot "$PM"
          shot "$PM" home
          for S in touch mischief snackToss sockTug cushionHunt wardrobe stamps share settings asleep; do
            shot "$PM" "$S" -LMScreen "$S"
          done
          xcrun simctl ui "$PM" appearance dark
          shot "$PM" dark-grape -LMScreen touch -LMTheme grape -LMHat leaf
          xcrun simctl spawn "$PM" log show --last 5m --predicate 'process == "LittleMenace" AND (messageType == error OR messageType == fault)' --style compact | grep -v "PrototypeTools\|getpwuid" | tail -30 || true
          xcrun simctl shutdown "$PM"
          ls shots

      - name: Publish screenshots to docs/screenshots (manual runs only)
        if: always() && github.event_name == 'workflow_dispatch'
        run: |
          rm -rf docs/screenshots && mkdir -p docs/screenshots
          for f in shots/*.png; do
            n=$(basename "$f" .png)
            sips -s format jpeg -s formatOptions 70 --resampleWidth 430 "$f" --out "docs/screenshots/$n.jpg" >/dev/null
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git commit -m "Update simulator screenshots [skip ci]" || exit 0
          # The branch may have moved while this ran; land the screenshots on top of it.
          git pull --rebase origin ${GITHUB_REF_NAME}
          git push origin HEAD:${GITHUB_REF_NAME}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/
          if-no-files-found: ignore
