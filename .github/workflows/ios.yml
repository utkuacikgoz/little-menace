name: iOS build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: xcodebuild -version && swift --version

      - name: Core logic tests
        run: swift test --package-path MenaceCore

      - name: Build app for simulator
        run: |
          set -o pipefail
          xcodebuild -project LittleMenace.xcodeproj -scheme LittleMenace \
            -destination 'generic/platform=iOS Simulator' -configuration Debug \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 \
            | grep -E "error:|warning: .*(deprecated|never|unused)|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Debug-iphonesimulator/LittleMenace.app

      - name: Launch on simulators and screenshot
        run: |
          set -e
          mkdir -p shots
          for DEVICE in "iPhone SE (3rd generation)" "iPhone 16 Pro Max"; do
            UDID=$(xcrun simctl list devices available | grep -F "$DEVICE (" | head -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
            if [ -z "$UDID" ]; then echo "no $DEVICE"; continue; fi
            xcrun simctl boot "$UDID" || true
            xcrun simctl bootstatus "$UDID" -b
            xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/LittleMenace.app
            xcrun simctl launch "$UDID" app.littlemenace.LittleMenace
            sleep 6
            NAME=$(echo "$DEVICE" | tr ' ()' '___')
            xcrun simctl io "$UDID" screenshot "shots/$NAME-light.png"
            xcrun simctl ui "$UDID" appearance dark
            sleep 2
            xcrun simctl io "$UDID" screenshot "shots/$NAME-dark.png"
            xcrun simctl spawn "$UDID" log show --last 1m --predicate 'process == "LittleMenace"' --style compact | grep -iE "fault|error|crash" | head -20 || true
            xcrun simctl shutdown "$UDID"
          done
          ls -la shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/
          if-no-files-found: ignore
