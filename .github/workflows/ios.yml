name: iOS build

# Pushes to main and every PR run the tests; the screenshot tour runs only when started by hand.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: Core tests
    runs-on: ubuntu-latest
    container: swift:6.1
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path MenaceCore

  app-tests:
    name: App tests (${{ matrix.shard }}/3)
    runs-on: macos-15
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: |
          set -o pipefail
          # UI tests are dealt round-robin across the shards; shard 0 also runs the StoreKit unit tests.
          ARGS=()
          i=0
          for t in $(grep -oE 'func test[A-Za-z0-9_]+' LittleMenaceUITests/LittleMenaceUITests.swift | cut -d' ' -f2); do
            if [ $((i % 3)) -eq ${{ matrix.shard }} ]; then ARGS+=("-only-testing:LittleMenaceUITests/LittleMenaceUITests/$t"); fi
            i=$((i + 1))
          done
          if [ ${{ matrix.shard }} -eq 0 ]; then ARGS+=("-only-testing:LittleMenaceTests"); fi
          xcodebuild test -project LittleMenace.xcodeproj -scheme LittleMenace \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro Max' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO "${ARGS[@]}" 2>&1 \
            | grep -E "Test Case .*(passed|failed)|error:|AUDIT|Executed|\*\* TEST"

  screenshots:
    name: Screenshots (${{ matrix.part }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      matrix:
        part: [a, b]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build -project LittleMenace.xcodeproj -scheme LittleMenace \
            -destination 'generic/platform=iOS Simulator' -configuration Debug \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO 2>&1 | grep -E "error:|\*\* BUILD"
      - name: Tour
        run: scripts/screenshot-tour.sh ${{ matrix.part }} build/Build/Products/Debug-iphonesimulator/LittleMenace.app shots
      - uses: actions/upload-artifact@v4
        with:
          name: shots-${{ matrix.part }}
          path: shots/

  publish:
    name: Publish screenshots
    needs: screenshots
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          pattern: shots-*
          merge-multiple: true
          path: shots
      - name: Commit to docs/screenshots
        run: |
          rm -rf docs/screenshots && mv shots docs/screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/screenshots
          git commit -m "Update simulator screenshots [skip ci]" || exit 0
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
