name: iOS build

# Pushes to main and PRs run the tests. A manual run takes screenshots only (no tests).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      tour:
        description: "review: every screen, small. store: full-size 6.9\" App Store shots. new: the newest screens, for review."
        type: choice
        options: [review, store, new]
        default: review

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: Core tests
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    container: swift:6.1
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path MenaceCore

  app-tests:
    name: App tests (${{ matrix.shard }}/3)
    if: github.event_name != 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: |
          set -o pipefail
          # UI tests are dealt round-robin across the shards; shard 0 also runs the StoreKit unit tests.
          ARGS=()
          i=0
          for t in $(grep -oE 'func test[A-Za-z0-9_]+' LittleMenaceUITests/LittleMenaceUITests.swift | cut -d' ' -f2); do
            if [ $((i % 3)) -eq ${{ matrix.shard }} ]; then ARGS+=("-only-testing:LittleMenaceUITests/LittleMenaceUITests/$t"); fi
            i=$((i + 1))
          done
          if [ ${{ matrix.shard }} -eq 0 ]; then ARGS+=("-only-testing:LittleMenaceTests"); fi
          # Runner images differ: prefer an iPhone 16 Pro Max, else the newest Pro Max, else any iPhone.
          SIM=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          phones = [d for rt, ds in json.load(sys.stdin)["devices"].items() if "iOS" in rt for d in ds if d["name"].startswith("iPhone")]
          pick = [d for d in phones if d["name"] == "iPhone 16 Pro Max"] or [d for d in phones if "Pro Max" in d["name"]] or phones
          print(pick[-1]["udid"])')
          xcodebuild test -project LittleMenace.xcodeproj -scheme LittleMenace \
            -destination "id=$SIM" \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO "${ARGS[@]}" 2>&1 \
            | grep -E "Test Case .*(passed|failed)|error:|AUDIT|Executed|\*\* TEST"

  screenshots:
    name: Screenshots (${{ matrix.part }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      matrix:
        part: ${{ fromJSON(inputs.tour == 'store' && '["store"]' || inputs.tour == 'new' && '["new"]' || '["a","b"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build -project LittleMenace.xcodeproj -scheme LittleMenace \
            -destination 'generic/platform=iOS Simulator' -configuration Debug \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO 2>&1 | grep -E "error:|\*\* BUILD"
      - name: Tour
        run: scripts/screenshot-tour.sh ${{ matrix.part }} build/Build/Products/Debug-iphonesimulator/LittleMenace.app shots
      - uses: actions/upload-artifact@v4
        with:
          name: shots-${{ matrix.part }}
          path: shots/

  publish:
    name: Publish screenshots
    needs: screenshots
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          pattern: shots-*
          merge-multiple: true
          path: shots
      - name: Commit screenshots
        env:
          DEST: ${{ inputs.tour == 'store' && 'docs/app-store-screenshots' || inputs.tour == 'new' && 'docs/review-screenshots' || 'docs/screenshots' }}
        run: |
          rm -rf "$DEST" && mv shots "$DEST"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "$DEST"
          git commit -m "Update simulator screenshots [skip ci]" || exit 0
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
